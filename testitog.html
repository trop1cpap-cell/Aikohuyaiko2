<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6200ee">
<meta name="mobile-web-app-capable" content="yes">
<title>Официант — ПО БАРАМ</title>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #6200ee; --primary-dark: #3700b3;
    --accent: #03dac6; --bg: #f5f5f5; --card: #fff;
    --text: #212121; --muted: #757575;
    --danger: #b00020; --success: #00c853; --border: #e0e0e0;
    --warn: #ff9800;
  }
  body {
    margin: 0; font-family: 'Roboto', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    padding-bottom: 100px; font-size: 16px; overscroll-behavior: none;
  }
  header {
    background: var(--primary); color: #fff; padding: 14px 16px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    display: flex; justify-content: space-between; align-items: center;
    min-height: 56px; gap: 8px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 500; flex: 1;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
              text-align: center; }
  header button {
    background: rgba(255,255,255,.15); color: #fff; border: 0;
    border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
  }
  header button:active { background: rgba(255,255,255,.3); }
  .user-badge {
    font-size: 11px; background: rgba(255,255,255,.25);
    padding: 3px 8px; border-radius: 10px; margin-left: 4px;
  }

  .tables {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 12px; padding: 14px;
  }
  .table-btn {
    background: var(--card); border-radius: 12px; padding: 18px 4px;
    text-align: center; font-size: 16px; font-weight: 500;
    cursor: pointer; position: relative;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
    transition: box-shadow .15s, transform .1s;
    user-select: none;
  }
  .table-btn:active { transform: scale(.97); }
  .table-btn.busy { background: #ede7f6; }
  .table-btn.vip { background: linear-gradient(135deg,#fff8e1,#ffe082); }
  .table-btn.vip.busy { background: linear-gradient(135deg,#ffe082,#ffb300); }
  .table-btn.bar { background: linear-gradient(135deg,#e3f2fd,#bbdefb); }
  .table-btn.bar.busy { background: linear-gradient(135deg,#90caf9,#42a5f5); }
  .table-btn .badge {
    position: absolute; top: 6px; right: 6px;
    background: var(--danger); color: #fff; font-size: 11px;
    border-radius: 10px; padding: 1px 7px; font-weight: 600;
  }
  .table-btn .sum {
    display: block; font-size: 12px; color: var(--muted);
    margin-top: 3px; font-weight: 400;
  }
  .table-btn .served-by {
    display: block; font-size: 10px; color: var(--primary);
    margin-top: 2px; font-weight: 600;
  }

  .panel { display: none; padding: 0 14px; }
  .panel.show { display: block; }

  .guests-tabs {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 10px 0 4px; margin-bottom: 6px;
    scrollbar-width: none;
  }
  .guests-tabs::-webkit-scrollbar { display: none; }
  .guest-tab {
    background: #fff; border: 2px solid transparent;
    padding: 8px 14px; border-radius: 20px;
    font-size: 14px; font-weight: 500; white-space: nowrap;
    cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    display: flex; align-items: center; gap: 6px;
  }
  .guest-tab.active { background: var(--primary); color: #fff; }
  .guest-tab .g-sum { font-size: 12px; opacity: .8; }
  .guest-tab .g-del {
    background: rgba(0,0,0,.1); border: 0; border-radius: 50%;
    width: 20px; height: 20px; font-size: 12px; line-height: 1;
    cursor: pointer; color: inherit; padding: 0;
  }
  .guest-tab.active .g-del { background: rgba(255,255,255,.25); }

  .add-guest-btn {
    background: #fff; border: 2px dashed var(--border);
    padding: 8px 14px; border-radius: 20px;
    font-size: 14px; color: var(--muted);
    cursor: pointer; white-space: nowrap;
  }

  .order-item {
    background: var(--card); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .order-item .info { flex: 1; min-width: 0; }
  .order-item .name { font-weight: 500; word-wrap: break-word; }
  .order-item .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .order-item .price { font-weight: 700; white-space: nowrap; font-size: 15px; }
  .order-item .controls {
    display: flex; align-items: center; gap: 4px;
    background: #f0f0f0; border-radius: 8px; padding: 2px;
  }
  .order-item .controls button {
    background: transparent; border: 0;
    width: 32px; height: 32px; border-radius: 6px;
    font-size: 18px; font-weight: 700; cursor: pointer;
    color: var(--primary);
  }
  .order-item .controls button:active { background: #ddd; }
  .order-item .qty { min-width: 24px; text-align: center; font-weight: 600; }

  .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 15px; }

  .totals {
    background: var(--card); border-radius: 12px; padding: 12px 16px;
    margin: 8px 0 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .totals .row {
    display: flex; justify-content: space-between;
    padding: 4px 0; font-size: 15px;
  }
  .totals .row.big {
    font-size: 20px; font-weight: 700;
    border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px;
  }
  .totals .row.big span:last-child { color: var(--primary); }

  .actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .actions button {
    flex: 1; min-width: 120px;
    padding: 12px; border: 0; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger  { background: var(--danger);  color: #fff; }
  .btn-warn    { background: var(--warn);    color: #fff; }
  .btn-ghost   { background: #e0e0e0;        color: #333; }
  .actions button:active { opacity: .85; }

  .modal-back {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 100;
    justify-content: center; align-items: flex-end;
  }
  .modal-back.show { display: flex; }
  .modal {
    background: #fff; width: 100%; max-height: 90vh;
    border-radius: 16px 16px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto; animation: slideUp .25s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%);} to {transform: translateY(0);} }
  .modal h2 { margin: 0 0 14px; font-size: 19px; }
  .modal pre {
    background: #f5f5f5; border-radius: 8px; padding: 14px;
    font-family: 'Roboto Mono', monospace; font-size: 13px;
    white-space: pre-wrap; word-wrap: break-word; margin: 0 0 14px;
  }
  .modal .row { display: flex; gap: 8px; margin-top: 8px; }
  .modal .row button {
    flex: 1; padding: 12px; border: 0; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .modal .row .copy  { background: var(--primary); color: #fff; }
  .modal .row .share { background: var(--accent); color: #000; }
  .modal .row .close { background: #e0e0e0; color: #333; }
  .modal .row .danger{ background: var(--danger); color: #fff; }

  .cat-tabs {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 4px 0 10px; scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    background: #fff; border: 0; padding: 8px 14px;
    border-radius: 20px; font-size: 14px; font-weight: 500;
    white-space: nowrap; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); color: #333;
  }
  .cat-tab.active { background: var(--primary); color: #fff; }
  .cat-tab.special {
    background: linear-gradient(135deg,#fff8e1,#ffe082);
    color: #5d4037; font-weight: 600;
  }
  .cat-tab.special.active {
    background: linear-gradient(135deg,#ffb300,#ff8f00);
    color: #fff;
  }

  .menu-grid { display: grid; gap: 8px; }
  .menu-item {
    background: #fff; border-radius: 12px; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    user-select: none;
    transition: background .15s;
  }
  .menu-item:active { background: #f0f0f0; }
  .menu-item.flash { background: #c8e6c9; }
  .menu-item.special { background: linear-gradient(135deg,#fffde7,#fff9c4); }
  .menu-item.special .mi-price { color: #ff6f00; }
  .menu-item .mi-info { flex: 1; min-width: 0; }
  .menu-item .mi-name { font-weight: 500; }
  .menu-item .mi-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .menu-item .mi-price { font-weight: 700; color: var(--primary); white-space: nowrap; margin-left: 10px; }

  .shift-summary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; padding: 18px; border-radius: 14px;
    margin-bottom: 14px;
  }
  .shift-summary .lbl { opacity: .8; font-size: 13px; }
  .shift-summary .val { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
  .shift-summary .val:last-child { margin-bottom: 0; }

  .shift-row {
    background: #fff; border-radius: 10px; padding: 12px 14px;
    margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .shift-row .sr-head {
    display: flex; justify-content: space-between; font-weight: 600;
    margin-bottom: 4px;
  }
  .shift-row .sr-sub { font-size: 13px; color: var(--muted); }

  .role-select {
    text-align: center; padding: 40px 20px;
  }
  .role-select h2 { margin-bottom: 20px; }
  .role-btn {
    display: block; width: 100%; max-width: 300px;
    margin: 10px auto; padding: 16px;
    border: 2px solid var(--primary); border-radius: 12px;
    background: #fff; color: var(--primary);
    font-size: 17px; font-weight: 600; cursor: pointer;
  }
  .role-btn:active { background: var(--primary); color: #fff; }
</style>
</head>
<body>

<!-- ================= ЭКРАН ВЫБОРА РОЛИ ================= -->
<div id="roleView" class="role-select">
  <h2>👋 Добро пожаловать!</h2>
  <p style="color:#757575;margin-bottom:20px;">Выберите вашу роль:</p>
  <button class="role-btn" onclick="setRole('Официант')">🍽 Официант</button>
  <button class="role-btn" onclick="setRole('Бармен')">🍸 Бармен</button>
  <button class="role-btn" onclick="setRole('Администратор')">👑 Администратор</button>
</div>

<header id="mainHeader" style="display:none">
  <button id="backBtn" style="display:none" onclick="goBack()">←</button>
  <h1 id="title">Столы</h1>
  <div style="display:flex;gap:6px;align-items:center;">
    <span class="user-badge" id="userBadge"></span>
    <button onclick="openShiftReport()">📊</button>
  </div>
</header>

<!-- ================= ЭКРАН СТОЛОВ ================= -->
<div id="tablesView" class="tables" style="display:none"></div>

<!-- ================= ЭКРАН СТОЛА ================= -->
<div id="orderView" class="panel">
  <div class="guests-tabs" id="guestsTabs"></div>

  <div id="orderList"></div>

  <div class="totals" id="totalsBox">
    <div class="row"><span>Позиций у гостя:</span><span id="guestCount">0</span></div>
    <div class="row"><span>Счёт гостя:</span><span id="guestSum">0 ₽</span></div>
    <div class="row big"><span>Итого по столу:</span><span id="tableSum">0 ₽</span></div>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="openMenu()">🍽 Меню</button>
    <button class="btn-success" onclick="showBill(false)">🧾 Счёт гостя</button>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="showBill(true)">🧾 Счёт на стол</button>
  </div>
  <div class="actions">
    <button class="btn-danger" onclick="confirmClearTable()">🗑 Очистить</button>
    <button class="btn-warn" onclick="closeTableAndPay()">💳 Оплатить</button>
  </div>
</div>

<!-- ================= МОДАЛКА: МЕНЮ ================= -->
<div class="modal-back" id="menuModal" onclick="if(event.target===this) closeModal('menuModal')">
  <div class="modal">
    <h2>Меню — <span id="menuGuestLabel"></span></h2>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="menu-grid" id="menuGrid"></div>
    <div class="row">
      <button class="close" onclick="closeModal('menuModal')">Закрыть</button>
    </div>
  </div>
</div>

<!-- ================= МОДАЛКА: СЧЁТ ================= -->
<div class="modal-back" id="billModal" onclick="if(event.target===this) closeModal('billModal')">
  <div class="modal">
    <h2 id="billTitle">Счёт</h2>
    <pre id="billText"></pre>
    <div class="row">
      <button class="copy" onclick="copyBill()">📋 Копировать</button>
      <button class="share" onclick="shareBill()">📤 Отправить</button>
    </div>
    <div class="row">
      <button class="close" onclick="closeModal('billModal')">Закрыть</button>
    </div>
  </div>
</div>

<!-- ================= МОДАЛКА: ПОДТВЕРЖДЕНИЕ ================= -->
<div class="modal-back" id="confirmModal" onclick="if(event.target===this) closeModal('confirmModal')">
  <div class="modal">
    <h2 id="confirmTitle">Подтвердите действие</h2>
    <p id="confirmText" style="margin:0 0 14px; color:#555;"></p>
    <div class="row">
      <button class="close" onclick="closeModal('confirmModal')">Отмена</button>
      <button class="danger" id="confirmOk">Да</button>
    </div>
  </div>
</div>

<!-- ================= МОДАЛКА: ОТЧЁТ ЗА СМЕНУ ================= -->
<div class="modal-back" id="shiftModal" onclick="if(event.target===this) closeModal('shiftModal')">
  <div class="modal">
    <h2>Отчёт за смену</h2>
    <div id="shiftContent"></div>
    <div class="row">
      <button class="copy" onclick="copyShiftReport()">📋 Копировать</button>
      <button class="close" onclick="closeModal('shiftModal')">Закрыть</button>
    </div>
    <div class="row">
      <button class="danger" onclick="confirmResetShift()">♻️ Сбросить смену</button>
    </div>
  </div>
</div>

const SPECIAL_CATEGORIES = ['⭐ Доп. услуги'];

/* Столы: 1-8, VIP, Бар 1, Бар 2 */
const TABLE_IDS = [1,2,3,4,5,6,7,8,'VIP','Бар 1','Бар 2'];
const STORAGE_KEY = 'waiter_orders_v4';
const SHIFT_KEY   = 'waiter_shift_v4';
const ROLE_KEY    = 'waiter_role_v4';

/* ============================================================
   STATE
   ============================================================ */
let orders   = {};
let shift    = [];
let currentTable = null;
let currentGuest = null;
let currentBillText = '';
let currentCategory = Object.keys(MENU)[0];
let userRole = null;
let userName = '';
let isLoading = true;

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function fmt(n) { return n.toLocaleString('ru-RU') + ' ₽'; }
function tableLabel(id) {
  if (id === 'VIP') return 'VIP';
  if (id === 'Бар 1' || id === 'Бар 2') return id;
  return 'Стол ' + id;
}
function isBarTable(id) { return id === 'Бар 1' || id === 'Бар 2'; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function openModal(id)  { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

/* ============================================================
   TELEGRAM CLOUD STORAGE (с фолбэком на localStorage)
   ============================================================ */
async function tgSave(key, value) {
  const str = JSON.stringify(value);
  if (tg?.CloudStorage) {
    return new Promise((resolve) => {
      tg.CloudStorage.setItem(key, str, (err) => {
        if (err) { localStorage.setItem(key, str); }
        resolve();
      });
    });
  } else {
    localStorage.setItem(key, str);
    return Promise.resolve();
  }
}

async function tgLoad(key, fallback) {
  if (tg?.CloudStorage) {
    return new Promise((resolve) => {
      tg.CloudStorage.getItem(key, (err, value) => {
        if (err || !value) {
          const local = localStorage.getItem(key);
          resolve(local ? JSON.parse(local) : fallback);
        } else {
          try { resolve(JSON.parse(value)); } catch { resolve(fallback); }
        }
      });
    });
  } else {
    const local = localStorage.getItem(key);
    return Promise.resolve(local ? JSON.parse(local) : fallback);
  }
}

async function saveAll() {
  await tgSave(STORAGE_KEY, orders);
  await tgSave(SHIFT_KEY, shift);
}

/* ============================================================
   РОЛЬ ПОЛЬЗОВАТЕЛЯ
   ============================================================ */
function setRole(role) {
  userRole = role;
  // Получаем имя из Telegram
  if (tg?.initDataUnsafe?.user) {
    const u = tg.initDataUnsafe.user;
    userName = u.first_name + (u.last_name ? ' ' + u.last_name : '');
  } else {
    userName = role;
  }
  document.getElementById('userBadge').textContent = `${userRole} • ${userName.split(' ')[0]}`;
  document.getElementById('roleView').style.display = 'none';
  document.getElementById('mainHeader').style.display = 'flex';
  document.getElementById('tablesView').style.display = 'grid';

  tgSave(ROLE_KEY, { role, name: userName });
  renderTables();
}

async function loadRole() {
  const saved = await tgLoad(ROLE_KEY, null);
  if (saved && saved.role) {
    userRole = saved.role;
    userName = saved.name || saved.role;
    document.getElementById('userBadge').textContent = `${userRole} • ${userName.split(' ')[0]}`;
    document.getElementById('roleView').style.display = 'none';
    document.getElementById('mainHeader').style.display = 'flex';
    document.getElementById('tablesView').style.display = 'grid';
    return true;
  }
  return false;
}

/* ============================================================
   DATA HELPERS
   ============================================================ */
function getTable(id) {
  if (!orders[id]) orders[id] = { guests: {}, openedAt: Date.now(), servedBy: userName, role: userRole };
  return orders[id];
}
function guestTotal(id, guest) {
  const items = (orders[id]?.guests?.[guest]) || [];
  return items.reduce((s, it) => s + it.price * it.qty, 0);
}
function tableTotal(id) {
  const g = orders[id]?.guests || {};
  return Object.keys(g).reduce((s, k) => s + guestTotal(id, k), 0);
}
function tableItemCount(id) {
  const g = orders[id]?.guests || {};
  return Object.values(g).reduce((s, arr) => s + arr.reduce((a,it)=>a+it.qty,0), 0);
}
function isTableEmpty(id) { return tableItemCount(id) === 0; }

/* ============================================================
   ЭКРАН СТОЛОВ
   ============================================================ */
function renderTables() {
  const el = document.getElementById('tablesView');
  el.innerHTML = '';
  TABLE_IDS.forEach(id => {
    const items = tableItemCount(id);
    const total = tableTotal(id);
    const btn = document.createElement('div');
    btn.className = 'table-btn';
    if (id === 'VIP') btn.classList.add('vip');
    if (isBarTable(id)) btn.classList.add('bar');
    if (items > 0) btn.classList.add('busy');
    btn.innerHTML = `${tableLabel(id)}` + (items ? `<span class="sum">${fmt(total)}</span>` : '');
    if (items && orders[id]?.servedBy) {
      btn.innerHTML += `<span class="served-by">${escapeHtml(orders[id].servedBy.split(' ')[0])}</span>`;
    }
    if (items) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = items;
      btn.appendChild(badge);
    }
    btn.onclick = () => openTable(id);
    el.appendChild(btn);
  });
}

/* ============================================================
   ЭКРАН СТОЛА
   ============================================================ */
function openTable(id) {
  currentTable = id;
  const t = getTable(id);
  if (Object.keys(t.guests).length === 0) addGuest(false);
  currentGuest = Object.keys(t.guests)[0];

  document.getElementById('tablesView').style.display = 'none';
  document.getElementById('orderView').classList.add('show');
  document.getElementById('backBtn').style.display = 'inline-block';
  document.getElementById('title').textContent = tableLabel(id);

  renderOrderScreen();
}

function goBack() {
  currentTable = null;
  currentGuest = null;

  document.getElementById('tablesView').style.display = 'grid';
  document.getElementById('orderView').classList.remove('show');
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('title').textContent = 'Столы';

  renderTables();
}

window.addEventListener('popstate', () => {
  if (currentTable !== null) goBack();
  history.pushState({}, '', '');
});
history.pushState({}, '', '');

/* ---- гости ---- */
function addGuest(render = true) {
  const t = getTable(currentTable);
  let n = 1;
  while (t.guests['Гость ' + n]) n++;
  t.guests['Гость ' + n] = [];
  if (!currentGuest) currentGuest = 'Гость ' + n;
  saveAll();
  if (render) renderOrderScreen();
}

function removeGuest(g) {
  const tbl = currentTable;
  confirmAction(
    'Удалить гостя?',
    `Все позиции «${g}» будут удалены.`,
    () => {
      if (!orders[tbl]) return;
      delete orders[tbl].guests[g];
      const rest = Object.keys(orders[tbl].guests);
      if (rest.length === 0) {
        orders[tbl].guests['Гость 1'] = [];
        currentGuest = 'Гость 1';
      } else {
        currentGuest = rest[0];
      }
      saveAll();
      renderOrderScreen();
    }
  );
}

function selectGuest(g) { currentGuest = g; renderOrderScreen(); }

function renderOrderScreen() {
  if (currentTable === null) return;
  renderGuestTabs();
  renderOrderList();
  renderTotals();
}

function renderGuestTabs() {
  const wrap = document.getElementById('guestsTabs');
  const t = getTable(currentTable);
  wrap.innerHTML = '';
  Object.keys(t.guests).forEach(g => {
    const tab = document.createElement('button');
    tab.className = 'guest-tab' + (g === currentGuest ? ' active' : '');
    const sum = guestTotal(currentTable, g);
    tab.innerHTML = `<span>${g}</span><span class="g-sum">${sum ? fmt(sum) : ''}</span>`;
    tab.onclick = () => selectGuest(g);

    const del = document.createElement('button');
    del.className = 'g-del';
    del.textContent = '×';
    del.onclick = (e) => { e.stopPropagation(); removeGuest(g); };
    tab.appendChild(del);

    wrap.appendChild(tab);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'add-guest-btn';
  addBtn.textContent = '+ Гость';
  addBtn.onclick = () => addGuest();
  wrap.appendChild(addBtn);
}

function renderOrderList() {
  const list = document.getElementById('orderList');
  const items = getTable(currentTable).guests[currentGuest] || [];
  list.innerHTML = '';

  if (!items.length) {
    list.innerHTML = '<div class="empty">Пусто. Нажмите «🍽 Меню» чтобы добавить позицию.</div>';
    return;
  }

  items.forEach((it, idx) => {
    const sum = it.price * it.qty;
    const row = document.createElement('div');
    row.className = 'order-item';
    row.innerHTML = `
      <div class="info">
        <div class="name">${escapeHtml(it.name)}</div>
        <div class="sub">${fmt(it.price)} × ${it.qty} = ${fmt(sum)}</div>
      </div>
      <div class="price">${fmt(sum)}</div>
      <div class="controls">
        <button data-act="dec">−</button>
        <span class="qty">${it.qty}</span>
        <button data-act="inc">+</button>
      </div>
    `;
    row.querySelector('[data-act="dec"]').onclick = (e) => { e.stopPropagation(); changeQty(idx, -1); };
    row.querySelector('[data-act="inc"]').onclick = (e) => { e.stopPropagation(); changeQty(idx, +1); };
    list.appendChild(row);
  });
}

function renderTotals() {
  const items = getTable(currentTable).guests[currentGuest] || [];
  const guestQty = items.reduce((s, it) => s + it.qty, 0);
  document.getElementById('guestCount').textContent = guestQty;
  document.getElementById('guestSum').textContent = fmt(guestTotal(currentTable, currentGuest));
  document.getElementById('tableSum').textContent = fmt(tableTotal(currentTable));
}

function changeQty(idx, delta) {
  const items = getTable(currentTable).guests[currentGuest];
  const it = items[idx];
  if (!it) return;
  it.qty += delta;
  if (it.qty <= 0) items.splice(idx, 1);
  vibrate(12);
  saveAll();
  requestAnimationFrame(renderOrderScreen);
}

/* ============================================================
   МЕНЮ
   ============================================================ */
function openMenu() {
  document.getElementById('menuGuestLabel').textContent =
    `${tableLabel(currentTable)} • ${currentGuest}`;
  currentCategory = Object.keys(MENU)[0];
  renderCatTabs();
  renderMenuGrid();
  openModal('menuModal');
}

function renderCatTabs() {
  const wrap = document.getElementById('catTabs');
  wrap.innerHTML = '';
  Object.keys(MENU).forEach(cat => {
    const btn = document.createElement('button');
    const isSpecial = SPECIAL_CATEGORIES.includes(cat);
    btn.className = 'cat-tab'
      + (isSpecial ? ' special' : '')
      + (cat === currentCategory ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { currentCategory = cat; renderCatTabs(); renderMenuGrid(); };
    wrap.appendChild(btn);
  });
}

function renderMenuGrid() {
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = '';
  const isSpecial = SPECIAL_CATEGORIES.includes(currentCategory);
  MENU[currentCategory].forEach(dish => {
    const el = document.createElement('div');
    el.className = 'menu-item' + (isSpecial ? ' special' : '');
    el.innerHTML = `
      <div class="mi-info">
        <div class="mi-name">${escapeHtml(dish.name)}</div>
        ${dish.desc ? `<div class="mi-desc">${escapeHtml(dish.desc)}</div>` : ''}
      </div>
      <div class="mi-price">${fmt(dish.price)}</div>
    `;
    el.onclick = () => addDishToGuest(dish, el);
    grid.appendChild(el);
  });
}

function addDishToGuest(dish, el) {
  if (currentTable === null || !currentGuest) return;
  const items = getTable(currentTable).guests[currentGuest];
  if (!items) return;
  const existing = items.find(i => i.name === dish.name && i.price === dish.price);
  if (existing) existing.qty += 1;
  else items.push({ name: dish.name, price: dish.price, qty: 1, category: currentCategory, addedBy: userName });

  vibrate(15);
  saveAll();

  if (el) {
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 250);
  }
  renderOrderScreen();
}

/* ============================================================
   СЧЁТ
   ============================================================ */
function buildBillText(fullTable = false) {
  const t = getTable(currentTable);
  let text = `${tableLabel(currentTable)}\n`;
  text += `Открыт: ${new Date(t.openedAt).toLocaleString('ru-RU')}\n`;
  text += `Обслуживает: ${t.servedBy || userName}\n`;
  text += '─'.repeat(28) + '\n\n';

  if (fullTable) {
    Object.keys(t.guests).forEach(g => {
      const items = t.guests[g];
      if (!items.length) return;
      text += `▸ ${g}\n`;
      items.forEach(it => {
        const sum = it.price * it.qty;
        if (it.qty > 1) {
          text += `  ${it.qty}x ${it.name}\n`;
          text += `     ${fmt(it.price)} × ${it.qty} = ${fmt(sum)}\n`;
        } else {
          text += `  ${it.name} — ${fmt(sum)}\n`;
        }
      });
      text += `  Итого по гостю: ${fmt(guestTotal(currentTable, g))}\n\n`;
    });
    text += '─'.repeat(28) + '\n';
    text += `ИТОГО ПО СТОЛУ: ${fmt(tableTotal(currentTable))}\n`;
  } else {
    const items = t.guests[currentGuest] || [];
    text += `▸ ${currentGuest}\n\n`;
    items.forEach(it => {
      const sum = it.price * it.qty;
      if (it.qty > 1) {
        text += `${it.qty}x ${it.name}\n`;
        text += `   ${fmt(it.price)} × ${it.qty} = ${fmt(sum)}\n`;
      } else {
        text += `${it.name} — ${fmt(sum)}\n`;
      }
    });
    text += '\n' + '─'.repeat(28) + '\n';
    text += `ИТОГО: ${fmt(guestTotal(currentTable, currentGuest))}\n`;
  }
  text += `\nДата: ${new Date().toLocaleString('ru-RU')}`;
  return text;
}

function showBill(fullTable = false) {
  if (currentTable === null) return;
  if (isTableEmpty(currentTable)) { alert('Стол пуст'); return; }
  currentBillText = buildBillText(fullTable);
  document.getElementById('billTitle').textContent = fullTable
    ? `Счёт — ${tableLabel(currentTable)} (весь стол)`
    : `Счёт — ${currentGuest} (${tableLabel(currentTable)})`;
  document.getElementById('billText').textContent = currentBillText;
  openModal('billModal');
}

async function copyBill() {
  try {
    await navigator.clipboard.writeText(currentBillText);
    const btn = event.target;
    const old = btn.textContent;
    btn.textContent = '✓ Скопировано';
    setTimeout(() => btn.textContent = old, 1500);
  } catch { alert('Не удалось скопировать'); }
}
async function shareBill() {
  if (navigator.share) {
    try { await navigator.share({ title: 'Счёт', text: currentBillText }); } catch {}
  } else copyBill();
}

/* ============================================================
   ПОДТВЕРЖДЕНИЕ
   ============================================================ */
function confirmAction(title, text, cb) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;

  const oldBtn = document.getElementById('confirmOk');
  const newBtn = oldBtn.cloneNode(true);
  oldBtn.parentNode.replaceChild(newBtn, oldBtn);
  newBtn.onclick = () => {
    closeModal('confirmModal');
    try { cb && cb(); } catch (e) { console.error(e); }
  };

  openModal('confirmModal');
}

function confirmClearTable() {
  if (currentTable === null) return;
  if (isTableEmpty(currentTable)) { alert('Стол уже пуст'); return; }
  const tbl = currentTable;
  const label = tableLabel(tbl);
  const count = tableItemCount(tbl);

  confirmAction(
    'Очистить стол?',
    `Все позиции (${count} шт) на ${label} будут удалены. Действие нельзя отменить.`,
    () => {
      delete orders[tbl];
      saveAll();
      goBack();
    }
  );
}

function closeTableAndPay() {
  if (currentTable === null) return;
  if (isTableEmpty(currentTable)) { alert('Стол пуст'); return; }
  const tbl = currentTable;
  const total = tableTotal(tbl);

  confirmAction(
    'Оплатить и закрыть стол?',
    `Сумма к оплате: ${fmt(total)}. Заказ будет записан в отчёт за смену.`,
    () => {
      const snapshot = JSON.parse(JSON.stringify(orders[tbl]));
      shift.push({
        table: tbl,
        guests: snapshot.guests,
        total: total,
        closedAt: Date.now(),
        servedBy: snapshot.servedBy || userName,
      });
      delete orders[tbl];
      saveAll();
      goBack();
    }
  );
}

/* ============================================================
   ОТЧЁТ ЗА СМЕНУ
   ============================================================ */
function openShiftReport() {
  renderShiftReport();
  openModal('shiftModal');
}

function renderShiftReport() {
  const wrap = document.getElementById('shiftContent');
  const totalRevenue = shift.reduce((s, x) => s + x.total, 0);
  const totalChecks  = shift.length;
  const avgCheck     = totalChecks ? Math.round(totalRevenue / totalChecks) : 0;

  let html = `
    <div class="shift-summary">
      <div class="lbl">Выручка за смену</div>
      <div class="val">${fmt(totalRevenue)}</div>
      <div class="lbl">Закрытых счетов</div>
      <div class="val">${totalChecks}</div>
      <div class="lbl">Средний чек</div>
      <div class="val">${fmt(avgCheck)}</div>
    </div>
  `;

  if (!shift.length) {
    html += '<div class="empty">Пока ни один стол не закрыт.</div>';
  } else {
    html += '<h3 style="margin:14px 0 8px;font-size:15px;">Закрытые столы</h3>';
    [...shift].reverse().forEach(x => {
      html += `
        <div class="shift-row">
          <div class="sr-head"><span>${tableLabel(x.table)}</span><span>${fmt(x.total)}</span></div>
          <div class="sr-sub">${new Date(x.closedAt).toLocaleTimeString('ru-RU')} • 
            ${x.servedBy ? 'Официант: ' + escapeHtml(x.servedBy) : ''}</div>
        </div>
      `;
    });
  }

  wrap.innerHTML = html;
}

function copyShiftReport() {
  const totalRevenue = shift.reduce((s, x) => s + x.total, 0);
  let text = `ОТЧЁТ ЗА СМЕНУ\n`;
  text += `Дата: ${new Date().toLocaleString('ru-RU')}\n`;
  text += '─'.repeat(28) + '\n';
  text += `Выручка: ${fmt(totalRevenue)}\n`;
  text += `Закрытых счетов: ${shift.length}\n`;
  text += `Средний чек: ${fmt(shift.length ? Math.round(totalRevenue/shift.length) : 0)}\n`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const old = btn.textContent;
    btn.textContent = '✓ Скопировано';
    setTimeout(() => btn.textContent = old, 1500);
  }).catch(() => alert(text));
}

function confirmResetShift() {
  const total = shift.reduce((s,x)=>s+x.total,0);
  confirmAction(
    'Сбросить смену?',
    `Отчёт (${shift.length} счетов на ${fmt(total)}) будет удалён.`,
    () => {
      shift = [];
      saveAll();
      renderShiftReport();
    }
  );
}

/* ============================================================
   INIT
   ============================================================ */
(async () => {
  // Загружаем данные из облака Telegram
  orders = await tgLoad(STORAGE_KEY, {});
  shift  = await tgLoad(SHIFT_KEY, []);

  // Пробуем загрузить роль
  const hasRole = await loadRole();

  // Если роли нет — показываем выбор
  if (!hasRole) {
    document.getElementById('roleView').style.display = 'block';
    document.getElementById('tablesView').style.display = 'none';
  } else {
    renderTables();
  }
})();
